services:
  db:
    build: ./db
    container_name: bluewave-db
    environment:
      POSTGRES_DB: bluewave
      POSTGRES_USER: bluewave
      POSTGRES_PASSWORD: bluewave
    ports:
      - "5432:5432"
    volumes:
      - bluewave_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluewave -d bluewave"]
      interval: 5s
      timeout: 5s
      retries: 10

  loader:
    build: ./loader
    container_name: bluewave-loader
    environment:
      DATABASE_URL: postgresql://bluewave:bluewave@db:5432/bluewave
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - load

  player:
    build: ./player
    container_name: bluewave-player
    environment:
      # Default: local Lucky Baker mock (PLAYER_USE_MOCK=1). Set PLAYER_USE_MOCK=0 + live GAME_URL for Stake.
      GAME_URL: ${GAME_URL:-mock://lucky-baker}
      GAME_SLUG: ${GAME_SLUG:-lucky-baker}
      PLAYER_USE_MOCK: ${PLAYER_USE_MOCK:-1}
      PLAYER_API_KEY: ${PLAYER_API_KEY:-}
      PLAYER_API_BASE: ${PLAYER_API_BASE:-https://api.openai.com/v1}
      PLAYER_MODEL: ${PLAYER_MODEL:-gpt-4o-mini}
      PLAYER_LEARN_ITERATIONS: ${PLAYER_LEARN_ITERATIONS:-15}
    volumes:
      - media_data:/data
    profiles:
      - play

  mounter:
    build: ./mounter
    container_name: bluewave-mounter
    volumes:
      - media_data:/data
    profiles:
      - mount

  admin-api:
    build: ./admin-api
    container_name: bluewave-admin-api
    environment:
      DATABASE_URL: postgresql://bluewave:bluewave@db:5432/bluewave
      MEDIA_ROOT: /data
    ports:
      - "8000:8000"
    volumes:
      - media_data:/data
    depends_on:
      db:
        condition: service_healthy

  admin:
    build: ./admin
    container_name: bluewave-admin
    ports:
      - "8080:80"
    depends_on:
      - admin-api

volumes:
  bluewave_pgdata:
  media_data:
