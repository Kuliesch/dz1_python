services:
  db:
    build: ./db
    container_name: bluewave-db
    environment:
      POSTGRES_DB: bluewave
      POSTGRES_USER: bluewave
      POSTGRES_PASSWORD: bluewave
    ports:
      - "5432:5432"
    volumes:
      - bluewave_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluewave -d bluewave"]
      interval: 5s
      timeout: 5s
      retries: 10

  loader:
    build: ./loader
    container_name: bluewave-loader
    environment:
      DATABASE_URL: postgresql://bluewave:bluewave@db:5432/bluewave
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - load

  player:
    build: ./player
    container_name: bluewave-player
    environment:
      GAME_URL: ${GAME_URL:-}
    volumes:
      - player_data:/data
    profiles:
      - play
    # Optional: point at a permitted demo instead of the mock fixture
    # environment:
    #   GAME_URL: https://example.com/demo

volumes:
  bluewave_pgdata:
  player_data:
